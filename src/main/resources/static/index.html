<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Caja - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4">Gestión de Caja</h4>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" id="username" class="form-control" placeholder="admin" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" placeholder="123" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </form>
          <div id="loginAlert" class="alert alert-danger mt-3 d-none"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alert = document.getElementById('loginAlert');
    alert.classList.add('d-none');

    const res = await fetch('/api/usuarios/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });

    if(res.ok) {
      const data = await res.json();
      localStorage.setItem('jwtToken', data.token);
      localStorage.setItem('username', data.username);
      window.location.href = 'dashboard.html';
    } else {
      alert.innerText = 'Credenciales inválidas';
      alert.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
