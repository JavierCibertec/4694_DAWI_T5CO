<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal - Sistema de Caja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Sistema de Caja</a>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Cerrar Sesión</button>
    </div>
</nav>
<div class="container mt-5">
    <h2 class="mb-4">Módulos del Sistema</h2>
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Cuentas por Cobrar</h5>
                    <p class="card-text">Registro y lecturas de servicios.</p>
                    <a href="cuentas-por-cobrar.html" class="btn btn-primary">Ir a Módulo</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Caja y Cobranza</h5>
                    <p class="card-text">Cobro y emisión de recibos.</p>
                    <a href="cobros.html" class="btn btn-success">Ir a Módulo</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Egresos</h5>
                    <p class="card-text">Gastos y carga masiva CSV.</p>
                    <a href="egresos.html" class="btn btn-warning">Ir a Módulo</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Reportes</h5>
                    <p class="card-text">Resumen y descargas Excel.</p>
                    <a href="reportes.html" class="btn btn-info">Ir a Módulo</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    if (!localStorage.getItem('jwtToken')) window.location.href = 'index.html';
    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
</script>
</body>
</html>
