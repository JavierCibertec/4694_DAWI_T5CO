<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Egresos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light" onload="cargarListaEgresos()">
<div class="container">
    <a href="dashboard.html" class="btn btn-secondary mb-3">&larr; Volver</a>

    <h2 class="mb-4">Carga Masiva de Egresos (CSV)</h2>

    <!-- Formulario de Subida -->
    <div class="card p-4 shadow-sm mb-4">
        <form id="uploadForm">
            <div class="mb-3">
                <label class="form-label">Seleccionar archivo .CSV</label>
                <input type="file" id="fileInput" class="form-control" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-warning">Procesar Carga Masiva</button>
        </form>
    </div>

    <div id="egresosResult" class="alert alert-info d-none"></div>

    <!-- Encabezado de la Tabla con Botón de Limpieza -->
    <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
        <h4>Lista de Egresos Registrados</h4>
        <button class="btn btn-outline-danger btn-sm" onclick="vaciarEgresos()">
            🗑️ Vaciar Todos los Egresos
        </button>
    </div>

    <!-- Tabla Dinámica de Egresos -->
    <table class="table table-bordered table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Proveedor</th>
            <th>Documento</th>
            <th>Monto (S/)</th>
            <th>Motivo</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody id="tablaEgresos"></tbody>
    </table>
</div>

<script>
    // Validar token de sesión
    if (!localStorage.getItem('jwtToken')) {
        window.location.href = 'index.html';
    }

    // Carga automática de la lista al abrir la pantalla
    async function cargarListaEgresos() {
        const token = localStorage.getItem('jwtToken');
        try {
            const res = await fetch('/api/egresos', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const data = await res.json();
                const tbody = document.getElementById('tablaEgresos');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No hay egresos registrados.</td></tr>`;
                    return;
                }

                data.forEach(e => {
                    const badgeClass = e.estado === 'ACTIVO' ? 'bg-success' : 'bg-danger';
                    tbody.innerHTML += `<tr>
                            <td>${e.id}</td>
                            <td>${e.proveedor}</td>
                            <td>${e.documento}</td>
                            <td>S/ ${e.monto}</td>
                            <td>${e.motivo}</td>
                            <td><span class="badge ${badgeClass}">${e.estado}</span></td>
                        </tr>`;
                });
            }
        } catch (error) {
            console.error('Error al cargar egresos:', error);
        }
    }

    // Procesar subida del CSV
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('jwtToken');
        const formData = new FormData();
        formData.append('file', document.getElementById('fileInput').files[0]);

        const alertBox = document.getElementById('egresosResult');
        alertBox.innerText = 'Procesando archivo masivo...';
        alertBox.classList.remove('d-none');

        try {
            const res = await fetch('/api/egresos/cargar-masivo', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (res.ok) {
                const data = await res.json();
                alertBox.className = 'alert alert-success';
                alertBox.innerText = `Se cargaron ${data.length} egresos exitosamente desde el archivo.`;
                cargarListaEgresos(); // Refresca la tabla
            } else {
                alertBox.className = 'alert alert-danger';
                alertBox.innerText = `Error (${res.status}): No se pudo procesar la carga masiva.`;
            }
        } catch (error) {
            alertBox.className = 'alert alert-danger';
            alertBox.innerText = 'Error de conexión con el servidor.';
        }
    });

    // Eliminar/Vaciar todos los registros
    async function vaciarEgresos() {
        if (!confirm('¿Estás seguro de que deseas eliminar TODOS los egresos de la base de datos?')) {
            return;
        }

        const token = localStorage.getItem('jwtToken');
        try {
            const res = await fetch('/api/egresos/vaciar', {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok || res.status === 204) {
                const alertBox = document.getElementById('egresosResult');
                alertBox.className = 'alert alert-warning';
                alertBox.innerText = 'Se han eliminado todos los registros de egresos.';
                alertBox.classList.remove('d-none');
                cargarListaEgresos(); // Refresca la tabla para mostrarla vacía
            }
        } catch (error) {
            alert('No se pudo completar la eliminación.');
        }
    }
</script>
</body>
</html>
