<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes del Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <a href="dashboard.html" class="btn btn-secondary mb-3">&larr; Volver</a>

    <h2 class="mb-4">Descarga de Reportes en Excel (.XLSX)</h2>

    <!-- Opción 1: Reporte Diario de Movimientos -->
    <div class="card p-4 shadow-sm mb-4">
        <h5 class="card-title text-success mb-3">1. Reporte Diario de Caja y Recibos</h5>
        <div class="row align-items-end g-3">
            <div class="col-md-5">
                <label class="form-label">Seleccionar Fecha</label>
                <input type="date" id="fechaReporte" class="form-control" value="2026-08-12">
            </div>
            <div class="col-md-5">
                <button class="btn btn-success w-100" onclick="descargarExcelDiario()">
                    Descargar Reporte Diario (.xlsx)
                </button>
            </div>
        </div>
    </div>

    <!-- Opción 2: Reporte Mensual de Egresos -->
    <div class="card p-4 shadow-sm mb-4">
        <h5 class="card-title text-warning mb-3">2. Reporte Mensual de Egresos</h5>
        <div class="row align-items-end g-3">
            <div class="col-md-3">
                <label class="form-label">Mes</label>
                <input type="number" id="mesReporte" class="form-control" value="8" min="1" max="12">
            </div>
            <div class="col-md-3">
                <label class="form-label">Año</label>
                <input type="number" id="anioReporte" class="form-control" value="2026">
            </div>
            <div class="col-md-4">
                <button class="btn btn-warning w-100" onclick="descargarExcelEgresos()">
                    Descargar Egresos (.xlsx)
                </button>
            </div>
        </div>
    </div>

    <div id="alertReportes" class="alert d-none mt-3"></div>
</div>

<script>
    // Validar sesión activa
    if (!localStorage.getItem('jwtToken')) {
        window.location.href = 'index.html';
    }

    function mostrarAlerta(mensaje, esError = false) {
        const alertBox = document.getElementById('alertReportes');
        alertBox.className = esError ? 'alert alert-danger mt-3' : 'alert alert-info mt-3';
        alertBox.innerText = mensaje;
        alertBox.classList.remove('d-none');
    }

    // Descarga 1: Reporte Diario
    async function descargarExcelDiario() {
        const fecha = document.getElementById('fechaReporte').value;
        if(!fecha) return mostrarAlerta('Por favor seleccione una fecha válida.', true);

        const token = localStorage.getItem('jwtToken');

        try {
            mostrarAlerta('Generando archivo Excel...');
            const response = await fetch(`/api/reportes/excel/diario?fecha=${fecha}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if(response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Reporte_Diario_${fecha}.xlsx`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                mostrarAlerta('Reporte Diario descargado con éxito.');
            } else {
                mostrarAlerta(`Error (${response.status}): No se pudo obtener el reporte.`, true);
            }
        } catch (error) {
            mostrarAlerta('Error de conexión con el servidor.', true);
        }
    }

    // Descarga 2: Egresos Mensuales
    async function descargarExcelEgresos() {
        const mes = document.getElementById('mesReporte').value;
        const anio = document.getElementById('anioReporte').value;
        const token = localStorage.getItem('jwtToken');

        try {
            mostrarAlerta('Generando reporte de egresos...');
            const response = await fetch(`/api/reportes/excel/egresos-mensual?mes=${mes}&anio=${anio}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if(response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Reporte_Egresos_${mes}_${anio}.xlsx`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                mostrarAlerta('Reporte de Egresos descargado con éxito.');
            } else {
                mostrarAlerta(`Error (${response.status}): No se pudo obtener el reporte.`, true);
            }
        } catch (error) {
            mostrarAlerta('Error de conexión con el servidor.', true);
        }
    }
</script>
</body>
</html>
